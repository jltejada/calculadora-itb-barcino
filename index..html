<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122e2b"><meta name="apple-mobile-web-app-capable" content="yes"><title>ITB Barcino</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#172b29;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:480px;margin:auto;padding:calc(26px + env(safe-area-inset-top)) 20px 40px}header{background:#123b35;color:white;padding:24px;border-radius:22px;margin-bottom:20px}header h1{margin:0;font-size:25px}header p{opacity:.8;margin:7px 0 0;font-size:14px}.panel{background:white;border:1px solid #e0e8e3;border-radius:20px;padding:22px;box-shadow:0 5px 24px #19352c0a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:650;font-size:14px;margin:0 0 7px}input{width:100%;padding:15px 12px;border:1px solid #cbd9d2;border-radius:12px;font-size:20px;color:#163c33;background:#fff}input:focus{outline:2px solid #32856d;outline-offset:1px}.score{margin-top:19px}.hint{font-size:12px;color:#65756e;margin-top:6px}button{border:0;border-radius:13px;padding:16px;font-size:17px;font-weight:700;background:#176b53;color:white;width:100%;margin-top:20px}button:active{background:#0e4939}.result{margin-top:20px;display:none}.result.visible{display:block}.status{font-weight:700;color:#176b53}.status.loss{color:#ae453a}.big{font-size:40px;font-weight:800;margin:7px 0}.new{font-size:21px;font-weight:700}.details{margin-top:16px;border-top:1px solid #e5ece8;padding-top:12px;font-size:14px}.line{display:flex;justify-content:space-between;padding:5px 0;gap:10px}.line span:last-child{text-align:right;font-variant-numeric:tabular-nums}.warn{font-size:13px;line-height:1.45;background:#fff6e4;border-radius:10px;padding:12px;margin-top:13px;color:#795322}.error{color:#b12f2f;font-size:14px;margin-top:12px;display:none}.foot{font-size:12px;color:#6c7d74;line-height:1.5;margin-top:18px;text-align:center}</style></head><body><main class="wrap"><header><h1>🎾 Calculadora ITB</h1><p>Club Tennis Barcino · Tenis individual</p></header><section class="panel"><div class="grid"><div><label for="mine">Mi ELO</label><input id="mine" type="number" min="0" step="1" inputmode="numeric" placeholder="2500"></div><div><label for="rival">ELO rival</label><input id="rival" type="number" min="0" step="1" inputmode="numeric" placeholder="2490"></div></div><div class="score"><label for="score">Resultado (mis juegos – juegos rival)</label><input id="score" type="text" inputmode="text" placeholder="9-7" autocomplete="off"><div class="hint">Ejemplos: 9-3, 7-9, 8-8, WO−, WO+</div></div><button id="calculate">Calcular ITB</button><div id="error" class="error" role="alert"></div></section><section class="panel result" id="result" aria-live="polite"><div id="status" class="status"></div><div class="big" id="change"></div><div class="new" id="newelo"></div><div class="details" id="details"></div><div class="warn" id="warning" style="display:none"></div></section><p class="foot">Basado exclusivamente en el documento «Sistema de Ranking ITB» del CT Barcino. No es una aplicación oficial del club.</p></main><script>const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:4}).format(n);function line(k,v){return '<div class="line"><span>'+k+'</span><span>'+v+'</span></div>'}function calculate(){const a=Number($('mine').value),b=Number($('rival').value),s=$('score').value.trim().toUpperCase().replace(/[–—−]/g,'-').replace(/\s/g,'');$('error').style.display='none';$('result').classList.remove('visible');if(!$('mine').value||!$('rival').value||!Number.isFinite(a)||!Number.isFinite(b)||a<0||b<0){return error('Introduce ambos ELO válidos.')}let status='',raw=null,initial=null,applied=null,warn='',factor=null,score=s;if(s==='WO-'||s==='WO+'){if(s==='WO-'){status='❌ WO−';applied=-20}else{status='WO+ a favor';warn='El reglamento no especifica los puntos que recibe el beneficiario de un WO+. No puede calcularse el nuevo ELO.'}}else{const m=s.match(/^(\d+)-(\d+)$/);if(!m)return error('Introduce un marcador válido, por ejemplo 9-7.');const x=Number(m[1]),y=Number(m[2]);if(x>9||y>9||x<0||y<0||Math.max(x,y)!==9&&x!==y)return error('El reglamento proporciona una tabla para partidos a 9 juegos. Revisa el marcador.');if(x===y&&x!==8)return error('Solo se admite 8-8 como empate definitivo en esta calculadora.');const e=1/(1+Math.pow(10,(b-a)/400));const r=x>y?1:x<y?0:.5;raw=20*(r-e);initial=Math.round(raw);if(x>y){status='🏆 Victoria';applied=initial}else if(x<y){status='❌ Derrota';factor=1-x/16;const exact=initial*factor;status='❌ Derrota';applied=Math.round(exact);if(!Number.isInteger(exact)){warn='Redondeo final provisional: el reglamento no especifica cómo redondear la penalización ajustada. Penalización exacta: '+fmt(exact)+' puntos; se muestra '+fmt(applied)+' como estimación, no como criterio oficial del club.'}}else{status='🤝 Empate';applied=initial;warn='El reglamento incluye R = 0,5, pero no especifica expresamente cómo registrar un partido terminado 8-8.'}var expected=e} $('status').textContent=status;$('status').className='status'+(status.includes('Derrota')||status.includes('WO−')?' loss':'');$('change').textContent=applied===null?'Sin variación definida':(applied>0?'+':'')+fmt(applied)+' puntos';$('newelo').textContent=applied===null?'Nuevo ELO: no determinado':'Nuevo ELO'+(warn.includes('provisional')?' estimado':'')+': '+fmt(a+applied);let rows=line('ELO inicial',fmt(a))+line('ELO rival',fmt(b))+line('Marcador',score);if(raw!==null)rows+=line('Resultado esperado',fmt(expected*100)+' %')+line('Variación calculada',fmt(raw))+line('Variación inicial redondeada',(initial>0?'+':'')+fmt(initial));if(factor!==null)rows+=line('Factor de penalización',fmt(factor*100)+' %')+line('Penalización final exacta',fmt(initial*factor));rows+=line('Variación aplicada'+(warn.includes('provisional')?' (provisional)':''),applied===null?'No determinada':(applied>0?'+':'')+fmt(applied));$('details').innerHTML=rows;$('warning').textContent=warn;$('warning').style.display=warn?'block':'none';$('result').classList.add('visible');$('result').scrollIntoView({behavior:'smooth',block:'nearest'})}function error(msg){$('error').textContent=msg;$('error').style.display='block'}$('calculate').addEventListener('click',calculate);$('score').addEventListener('keydown',e=>{if(e.key==='Enter')calculate()});</script></body></html>
